name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A függőségek telepítése NEM hagyható el. A tesztek maguk ugyan
      # függőség nélkül is futnak (tiszta függvények, csak a node: modulokat
      # használják), a `prisma validate` viszont a telepített prisma-t igényli –
      # enélkül az npx nem tudja feloldani, és a lépés elszáll.
      #
      # `npm ci`, nem `npm install`: pontosan a lockfile szerint telepít, tehát
      # a CI ugyanazt ellenőrzi, ami a szerverre kerül.
      - name: Függőségek telepítése
        run: npm ci

      - name: Tesztek
        run: npm test

      # Ugyanaz több időzónában – a szerver rendszer-időzónája nem
      # befolyásolhatja a naptárat (cPanelen ez tipikusan nem UTC)
      - name: Időzóna-függetlenség
        run: |
          for tz in UTC America/New_York Asia/Tokyo Europe/Budapest Australia/Sydney; do
            echo "== $tz =="
            TZ=$tz npm test
          done

      - name: Prisma séma ellenőrzése
        run: npx prisma validate
        env:
          DATABASE_URL: mysql://user:pass@localhost:3306/v40

      - name: Típusellenőrzés
        run: npx nuxt typecheck
