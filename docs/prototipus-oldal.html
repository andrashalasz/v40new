<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V40 Vital – teljes prototípus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* Tokenek a forráskódból, változtatás nélkül */
:root{
  --ink:#171008; --brand:#153131; --sand:#F4F4F0; --mint:#E5F7F9;
  --tag:rgba(47,115,242,.10); --line:#0000001A; --dim:#00000080;
  --warn:#A6541B; --warnbg:#FDF3EA; --ok:#1F6B4A; --okbg:#EFF7F2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:16px;line-height:1.55}
.dm{font-family:'DM Sans',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.inner{width:100%;max-width:1440px;margin:0 auto;padding:16px}
.sec{position:relative;width:100%}
@media(min-width:1024px){.sec{padding-left:100px;padding-right:100px}.inner{padding:16px 0}}

/* ---------- fejléc ---------- */
header{position:sticky;top:0;z-index:50;background:#fff;padding:24px;display:flex;align-items:center;justify-content:space-between}
@media(min-width:1024px){header{padding:24px 64px}}
header .logo img{height:36px;width:auto}
header .links{display:none}
@media(min-width:1024px){header .links{display:flex;align-items:center;gap:40px}}
header .links a{font-family:'DM Sans',sans-serif;color:var(--ink);font-size:16px}
header .links a.on{font-weight:700}
.burger{display:flex;flex-direction:column;gap:6px;padding:8px;background:none;border:0;cursor:pointer}
@media(min-width:1024px){.burger{display:none}}
.burger span{width:24px;height:2px;background:var(--ink);transition:.3s}
.mobmenu{position:absolute;top:100%;left:0;width:100%;background:#fff;border-top:1px solid #f1f1f1;box-shadow:0 12px 30px rgba(0,0,0,.09);display:flex;flex-direction:column;padding:24px;gap:20px}
@media(min-width:1024px){.mobmenu{display:none!important}}
.mobmenu a{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:500}
.proto{background:var(--mint);color:var(--brand);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:4px 8px;border-radius:4px;margin-left:10px;white-space:nowrap}

/* ---------- gombok ---------- */
.btn{display:inline-block;font:inherit;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;border:0;border-radius:8px;padding:16px 32px;background:var(--brand);color:var(--sand);text-align:center}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.out{background:transparent;color:var(--brand);border:2px solid var(--brand);padding:14px 30px}
.btn.light{background:var(--sand);color:var(--brand);font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.22)}
.btn.outlight{background:transparent;color:var(--sand);border:2px solid var(--sand);padding:14px 30px}
.btn.sm{padding:10px 18px;font-size:14px}
.btn.link{background:none;color:var(--dim);padding:10px 0;text-decoration:underline}

/* ---------- hero bannerek ---------- */
.banner{position:relative;width:100%;height:590px;display:flex;align-items:flex-end;padding:16px;overflow:hidden;background:var(--brand)}
@media(min-width:1024px){.banner{height:730px;padding:64px 96px}}
.banner .bg{position:absolute;inset:0;background-size:cover;background-position:top}
.banner .bgblur{position:absolute;inset:0;background-size:cover;background-position:top;filter:blur(12px);transform:scale(1.05);
  -webkit-mask-image:linear-gradient(to top,black 0%,transparent 40%);mask-image:linear-gradient(to top,black 0%,transparent 40%)}
.banner .fade{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0%,transparent 45%,rgba(21,49,49,.9) 100%)}
.banner .row{position:relative;z-index:10;width:100%;display:flex;flex-direction:column;align-items:flex-end;gap:24px}
@media(min-width:1024px){.banner .row{flex-direction:row;justify-content:space-between;align-items:flex-end}}
.banner h1{font-family:'DM Sans',sans-serif;font-weight:700;color:var(--sand);font-size:32px;line-height:1.3;margin:0 0 16px;text-shadow:0 8px 22px rgba(0,0,0,.45)}
@media(min-width:1024px){.banner h1{font-size:64px;max-width:460px}}
.banner p{font-family:'DM Sans',sans-serif;color:var(--sand);font-size:18px;line-height:1.3;margin:0 0 32px;text-shadow:0 4px 12px rgba(0,0,0,.4)}
@media(min-width:1024px){.banner p{max-width:490px}}
.banner .cta{display:flex;align-items:center;gap:16px;width:100%}
@media(min-width:1024px){.banner .cta{width:auto}}
.banner .cta>*{flex:1}
@media(min-width:1024px){.banner .cta>*{flex:none}}

/* ---------- szekciók ---------- */
.pagehero{background:var(--mint);padding:56px 16px;text-align:center}
.pagehero h1{font-family:'DM Sans',sans-serif;font-weight:700;font-size:clamp(30px,5.2vw,60px);line-height:1.1;margin:0 0 14px}
.pagehero p{max-width:540px;margin:0 auto;font-size:18px;font-family:'DM Sans',sans-serif}

.h2{font-family:'DM Sans',sans-serif;font-weight:700;font-size:28px;margin:0 0 16px;color:var(--ink)}
@media(min-width:1024px){.h2{font-size:48px}}
.lead{font-family:'DM Sans',sans-serif;font-size:18px;margin:0}
.head{display:flex;flex-direction:column;margin-bottom:64px}
.head.mid{align-items:center;text-align:center}
.head.mid .lead{max-width:540px}

.bg-sand{background:var(--sand)}
.bg-mint{background:var(--mint)}

.cards{display:flex;flex-direction:column;align-items:stretch;gap:16px}
@media(min-width:1024px){.cards{flex-direction:row;justify-content:center;gap:32px}}
.mintcard{background:var(--mint);padding:44px;border-radius:8px;display:flex;flex-direction:column;width:100%;box-shadow:0 4px 14px rgba(0,0,0,.07)}
.whitecard{background:#fff;padding:44px;border-radius:8px;display:flex;flex-direction:column;width:100%;box-shadow:0 4px 14px rgba(0,0,0,.07)}
.hr{width:100%;height:1px;background:var(--line);margin-bottom:32px}
.ct{font-weight:500;font-size:28px;margin:0 0 10px}
.cb{font-family:'DM Sans',sans-serif;font-size:18px;margin:0}
.icon72{height:72px;width:auto;margin-bottom:80px;align-self:flex-start}
.icon92{height:92px;width:auto;margin-bottom:40px;align-self:flex-start}

.floatcard{background:#fff;border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:16px}
.whyfloat{margin:24px 16px 0}
@media(min-width:1024px){.whyfloat{position:absolute;right:80px;top:-40px;margin:0;width:auto;
  max-width:330px;box-shadow:0 8px 28px rgba(0,0,0,.10)}}
@media(min-width:1024px){.floatcard{padding:32px}}
.chk{display:flex;align-items:center;gap:8px}
.chk img{height:24px;width:24px}
.chk p{color:var(--dim);font-family:'DM Sans',sans-serif;font-size:16px;margin:0}

.split{width:100%;display:flex;flex-direction:column;gap:16px}
@media(min-width:1024px){.split{flex-direction:row;justify-content:space-between}}
.split.rev{flex-direction:column-reverse}
@media(min-width:1024px){.split.rev{flex-direction:row}}
.imgpair{display:flex;flex-direction:column;gap:32px}
@media(min-width:1024px){.imgpair{flex-direction:row}}
.imgA{width:312px;height:273px;object-fit:cover;border-radius:4px}
.imgB{width:218px;height:207px;object-fit:cover;align-self:flex-end;border-radius:4px}
.imgC{width:100%;max-width:470px;height:310px;object-fit:cover;border-radius:4px}
.imgcol{display:flex;align-items:center;width:100%}
.imgcol img{width:100%;aspect-ratio:3/4;max-height:560px;object-fit:cover;object-position:center;
  border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.07)}
@media(max-width:1023px){.imgA,.imgB{width:100%;height:220px}}

.step{position:relative;background:var(--mint);padding:24px;border-radius:8px;display:flex;flex-direction:column;width:100%;box-shadow:0 4px 14px rgba(0,0,0,.07)}
.step .t{font-weight:500;font-size:24px;margin:0 0 56px;line-height:1.3}
.step .n{position:absolute;left:-16px;top:-16px;height:36px;width:36px;border-radius:50%;background:var(--brand);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center}
.steps5{display:flex;flex-direction:column;gap:32px}
@media(min-width:1024px){.steps5{flex-direction:row;gap:20px}}

.grid4{display:grid;grid-template-columns:1fr;gap:24px}
@media(min-width:640px){.grid4{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.grid4{grid-template-columns:repeat(4,1fr)}}
.grid3{display:grid;grid-template-columns:1fr;gap:24px}
@media(min-width:1024px){.grid3{grid-template-columns:repeat(3,1fr)}}

.blogimg{width:100%;height:260px;object-fit:cover;border-radius:16px;margin-bottom:8px}
.blogt{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:500;margin:8px 0 16px}
@media(min-width:1024px){.blogt{font-size:24px}}
.docimg{width:100%;height:320px;object-fit:cover;border-radius:8px;margin-bottom:16px}
.socimg{width:100%;height:550px;object-fit:cover;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
@media(max-width:1023px){.socimg,.docimg{height:340px}}

/* "Kinek ajánljuk" blokk */
.whoWrap{width:100%;display:flex;justify-content:center;margin:16px 0 40px}
.whoBox{position:relative;width:100%;max-width:670px;height:573px;background-size:cover;background-position:center;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.16)}
.whoSide{display:none}
@media(min-width:1280px){
  .whoSide{display:flex;position:absolute;top:208px;max-width:330px;background:#fff;border-radius:8px;padding:32px;flex-direction:column;gap:16px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
  .whoSide.r{right:-160px}.whoSide.l{left:-160px}
}
.whoMob{display:flex;flex-direction:column;gap:16px}
@media(min-width:1280px){.whoMob{display:none}}

/* footer */
footer.site{width:100%;background:var(--mint);padding:64px 16px}
@media(min-width:1024px){footer.site{padding:64px 100px}}
footer.site .fx{width:100%;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
@media(min-width:1024px){footer.site .fx{flex-direction:row;gap:0}}
footer.site .col{width:100%}
@media(min-width:1024px){footer.site .col{width:50%}}
footer.site .flogo{height:112px;width:auto;margin-bottom:32px}
footer.site p.about{font-family:'DM Sans',sans-serif;color:var(--dim);font-size:16px}
footer.site .socs{display:flex;align-items:center;gap:16px;margin-top:40px}
footer.site .socs img{height:80px;width:80px}
footer.site .lcol{display:flex;flex-direction:column}
@media(min-width:1024px){footer.site .col.links{display:flex;justify-content:flex-end}}
footer.site .lcol .lt{font-family:'DM Sans',sans-serif;font-weight:500;font-size:18px;margin-bottom:16px}
footer.site .lcol a{font-family:'DM Sans',sans-serif;font-size:16px;margin-bottom:8px}

/* MBanner kontakt sorok */
.kline{padding:32px 0;display:flex;align-items:center;gap:16px;border-bottom:1px solid rgba(255,255,255,.6)}
.kline img{height:48px;width:auto;display:none}
@media(min-width:1024px){.kline img{display:block}}
.kline p,.kline a{font-family:'DM Sans',sans-serif;font-weight:500;color:#fff;font-size:20px;margin:0}

.backdrop{position:fixed;inset:0;background:rgba(23,16,8,.55);z-index:100;display:flex;align-items:center;
  justify-content:center;padding:20px;overflow:auto}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;padding:32px;position:relative;
  box-shadow:0 24px 60px rgba(0,0,0,.28);max-height:88vh;overflow:auto}
@media(min-width:1024px){.modal{padding:44px}}
.modal .x{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;
  border:1px solid #E4E4DE;background:#fff;cursor:pointer;font-size:18px;line-height:1;color:#6B6660}
.modal img.ic{height:72px;width:auto;margin-bottom:24px}
.modal h3{font-family:'DM Sans',sans-serif;font-size:28px;font-weight:700;margin:0 0 8px}
.modal .sub{color:#6B6660;font-size:14px;margin:0 0 20px}
.modal p.body{font-family:'DM Sans',sans-serif;font-size:17px;margin:0 0 14px}
.modal .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.clickable{cursor:pointer}
.chk.clickable:hover p{color:var(--brand);text-decoration:underline}

/* ---------- foglalás / bérlet / fiók ---------- */
.tag{display:inline-block;background:var(--tag);color:var(--brand);border-radius:3px;padding:4px 9px;font-size:14px}
.price{font-family:'DM Sans',sans-serif;font-weight:700;font-size:28px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{font:inherit;font-size:14px;cursor:pointer;background:#fff;border:1px solid #E4E4DE;border-radius:999px;padding:8px 16px;color:#6B6660}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.card{background:#fff;border-radius:12px;padding:22px}
.srow{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center}
.srow h3{font-family:'DM Sans',sans-serif;font-size:21px;margin:0 0 6px}
.srow p{margin:0 0 12px;color:#6B6660;font-size:15px}
.srow .right{text-align:right}
@media(max-width:720px){.srow{grid-template-columns:1fr}.srow .right{text-align:left}}
.stepbar{display:flex;gap:6px;margin-bottom:28px;flex-wrap:wrap}
.stepbar div{font-size:13px;font-weight:600;color:#6B6660;background:#fff;border:1px solid #E4E4DE;border-radius:999px;padding:7px 15px}
.stepbar div.on{background:var(--brand);border-color:var(--brand);color:#fff}
.stepbar div.done{background:var(--mint);border-color:var(--mint);color:var(--brand)}
.panel{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
@media(max-width:960px){.panel{grid-template-columns:1fr}}
.daystrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:22px}
.day{flex:0 0 auto;width:74px;text-align:center;background:#fff;border:1px solid #E4E4DE;border-radius:9px;padding:11px 0;cursor:pointer}
.day small{display:block;font-size:11px;color:#6B6660;text-transform:uppercase;letter-spacing:.05em}
.day b{font-family:'DM Sans',sans-serif;font-size:19px}
.day i{display:block;font-style:normal;font-size:11px;color:#6B6660;margin-top:3px}
.day.on{background:var(--brand);border-color:var(--brand);color:#fff}
.day.on small,.day.on i{color:rgba(255,255,255,.72)}
.day.off{opacity:.4;cursor:not-allowed}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{font:inherit;font-weight:600;font-size:15px;cursor:pointer;background:#fff;border:1px solid #E4E4DE;border-radius:7px;padding:11px 15px;min-width:76px}
.slot.on{background:var(--brand);border-color:var(--brand);color:#fff}
.slot.taken{opacity:.32;cursor:not-allowed;text-decoration:line-through}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.field textarea{width:100%;font:inherit;padding:12px 13px;border:1px solid #E4E4DE;border-radius:8px;background:#fff;color:var(--ink)}
.field small{display:block;color:#6B6660;font-size:12px;margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
.payopt{display:flex;gap:13px;align-items:flex-start;background:#fff;border:2px solid #E4E4DE;border-radius:10px;padding:16px;cursor:pointer;margin-bottom:11px}
.payopt.on{border-color:var(--brand)}
.payopt.dis{opacity:.5;cursor:not-allowed}
.payopt input{margin-top:4px;width:17px;height:17px;accent-color:var(--brand)}
.payopt b{display:block;font-size:15px}
.payopt span{color:#6B6660;font-size:13.5px}
.summary{background:#fff;border-radius:12px;padding:20px;position:sticky;top:110px}
.summary h4{font-family:'DM Sans',sans-serif;font-size:16px;margin:0 0 14px}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-bottom:1px dashed #E4E4DE}
.line b{font-variant-numeric:tabular-nums;text-align:right}
.total{display:flex;justify-content:space-between;margin-top:14px;padding-top:13px;border-top:2px solid var(--ink);font-family:'DM Sans',sans-serif;font-weight:700;font-size:19px}
.hold{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;margin-top:14px}
.note{border-radius:9px;padding:13px 15px;font-size:14px;margin:16px 0}
.note.ok{background:var(--okbg);color:var(--ok)}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note.info{background:var(--mint);color:var(--brand)}
.passcard{background:#fff;border-radius:12px;padding:22px;margin-bottom:14px}
.passcard .ph{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}
.passcard h3{font-family:'DM Sans',sans-serif;font-size:20px;margin:0 0 6px}
.savebadge{background:var(--okbg);color:var(--ok);font-size:12px;font-weight:700;border-radius:4px;padding:3px 8px}
.bar{height:7px;background:#E4E4DE;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--brand)}
.barion{max-width:430px;margin:60px auto;background:#fff;border-radius:14px;padding:30px;box-shadow:0 12px 40px rgba(0,0,0,.09)}
.barion .mocklbl{background:var(--warnbg);color:var(--warn);font-size:11.5px;font-weight:700;text-align:center;border-radius:6px;padding:7px;margin-bottom:22px}
.cardbox{border:1px solid #E4E4DE;border-radius:9px;padding:14px;margin:18px 0;color:#6B6660;font-size:14px}
.qa{background:#fff;border-radius:10px;margin-bottom:10px;overflow:hidden}
.qa button{width:100%;text-align:left;font:inherit;font-family:'DM Sans',sans-serif;font-weight:600;font-size:17px;background:none;border:0;padding:20px;cursor:pointer;display:flex;justify-content:space-between;gap:14px;color:var(--ink)}
.qa .ans{padding:0 20px 20px;font-family:'DM Sans',sans-serif;color:#3f3f3f}
.qcard{background:#fff;border-radius:8px;padding:24px;margin-bottom:24px;border:1px solid #eee}
.qcard.dim{opacity:.4;pointer-events:none;transform:scale(.97)}
.qopt{display:flex;align-items:center;gap:16px;padding:16px;border-radius:12px;border:2px solid #f1f1f1;cursor:pointer;background:none;font:inherit;width:100%;text-align:left;margin-bottom:12px;color:#555}
.qopt.on{border-color:var(--ink);color:var(--ink)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.qopt.on .dot{border-color:var(--ink)}
.dot i{width:10px;height:10px;border-radius:50%;background:var(--ink);display:none}
.qopt.on .dot i{display:block}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.pad{padding-top:44px;padding-bottom:72px}
.hidden{display:none!important}
</style>

<div id="root"></div>

<script>
// ===========================================================================

function slotsFor(s, pr, off) {
  if (off*24 < s.leadH || off > s.maxD) return [];
  const d = new Date(); d.setDate(d.getDate()+off);
  const iso = d.getDay()===0 ? 7 : d.getDay();

  const taken = TAKEN[off]||[];
  const out = [];
  for (const [ws,we] of open)
    for (let t=ws; t+s.dur<=we; t+=SETTINGS.step)

const QUESTIONS = [
  { id:'gender', text:'Neme', options:[['Férfi','ferfi'],['Nő','no']] },
  { id:'goal', text:'Mi a célja a látogatással?', options:[['Energia növelés','energy'],['Sport regeneráció','sport'],['Immunerősítés','immune'],['Bőrfiatalítás','beauty']] },
  { id:'age', text:'Életkor', options:[['20–40 év között','young'],['40–60 év között','mid'],['60 év felett','senior']] },
];

function recommended() {
  const a = answers;
  if (a.goal==='beauty') return SERVICES.find(s=>s.title.includes('Radiance'));
  if (a.goal==='energy') return SERVICES.find(s=>s.title.includes('NAD+'));
  if (a.goal==='sport' && a.age==='senior') return SERVICES.find(s=>s.title.includes('CardioFit'));
  if (a.goal==='sport') return SERVICES.find(s=>s.title.includes('Powerfuel'));
  if (a.gender==='no' && a.age==='mid') return SERVICES.find(s=>s.title.includes('Femina'));
  return SERVICES[5];
}

        <button class="btn link" data-back="1">Vissza</button></div>`;
  }

  if (step === 3) {
    const rem = F.holdEnds ? Math.max(0, Math.ceil((F.holdEnds-Date.now())/1000)) : 0;

      return `<div class="passcard"><div class="ph">
        <div><h3 class="dm">${t.title}</h3>
          <div style="color:#6B6660;font-size:14px">Kód: <span class="mono">${mp.code}</span> · érvényes ${mp.until}-ig</div></div>
        <div style="text-align:right"><div class="price">${mp.remaining}/${mp.total}</div>
          <div style="color:#6B6660;font-size:13px">alkalom</div></div></div>
        <div class="bar"><i style="width:${pct}%"></i></div></div>`;}).join('')
      : '<div class="card" style="color:#6B6660">Nincs aktív bérleted.</div>'}
    <h3 class="dm" style="font-size:24px;margin:30px 0 14px">Foglalásaim</h3>
    ${me.bookings.length ? me.bookings.map(b=>`<div class="card" style="margin-bottom:12px"><div class="srow">
      <div><h3 class="dm">${b.title}</h3>
        <div style="color:#6B6660;font-size:14px">${b.when} · ${b.pract}</div>
        <div style="margin-top:8px"><span class="tag">${b.ref}</span> <span class="tag">${b.pay}</span></div></div>
      <div class="right"><button class="btn out sm" data-cancel="${b.ref}">Lemondás</button></div>
    </div></div>`).join('') : '<div class="card" style="color:#6B6660">Még nincs foglalásod. Indíts egyet a Kezelések menüből.</div>'}
  </div></div>`;
}

// ===========================================================================
//  Router
// ===========================================================================
const ROUTES = {
  '#fooldal':vFooldal, '#kezelesek':vKezelesek, '#berletek':vBerletek, '#longevity':vLongevity,
  '#navigator':vNavigator, '#rolunk':vRolunk, '#gyik':vGyik, '#blog':vBlog, '#kapcsolat':vKapcsolat,
  '#foglalas':vFoglalas, '#barion':vBarion, '#siker':vSiker, '#hiba':vHiba, '#fiok':vFiok,
};

function render() {
  const h = location.hash || '#fooldal';
  let view = ROUTES[h] || vFooldal;
  if ((h==='#foglalas'||h==='#siker') && !F.svcId && !F.buyPassId) view = vFooldal;
  if (h==='#barion' && !F.svcId && !F.buyPassId) view = vFooldal;

  const chrome = ['#barion'].includes(h);
  document.getElementById('root').innerHTML =
    (chrome ? header() + view() : header() + view() + footer()) + modal();

  bind();
  clearInterval(holdTimer);
  if (document.getElementById('holdbox')) holdTimer = setInterval(tickHold, 1000);
}

function tickHold() {
  const box = document.getElementById('holdbox');
  if (!box || !F.holdEnds) return clearInterval(holdTimer);
  const r = Math.max(0, Math.ceil((F.holdEnds-Date.now())/1000));
  box.textContent = r ? `Az időpontot ${Math.floor(r/60)}:${String(r%60).padStart(2,'0')} percig fenntartjuk.`
                      : 'A zárolás lejárt – az idősáv felszabadult.';
}

function saveForm() {
  const g = id => document.getElementById(id)?.value.trim() || '';
  F.form = { name:g('f_name'), phone:g('f_phone'), email:g('f_email'), note:g('f_note'), done:false };
  if (!F.form.name || !F.form.phone || !F.form.email) { alert('A név, telefon és e-mail megadása kötelező.'); return false; }
  F.form.done = true; return true;
}

function commit() {
  if (F.buyPassId) {
    const t = PASSES.find(x=>x.id===F.buyPassId);
    me.passes.push({ passId:t.id, code:F.ref, remaining:t.sessions, total:t.sessions,
      until:new Date(Date.now()+t.days*86400000).toISOString().slice(0,10) });
    return;
  }
  const s = svc(), l = dayLabel(F.day);
  let passUsed = null;
  if (F.pay==='PASS') { const mp = myPassFor(s.id); if (mp) { mp.remaining--; passUsed = mp.code; } }
  me.bookings.unshift({ ref:F.ref, title:s.title, pract:pract().name, when:`${l.iso} ${toHM(F.slot)}`, passUsed,
    pay:F.pay==='PASS'?'bérletből':F.pay==='CARD'?'kártyával fizetve':'helyszínen fizet' });
}

function bind() {
  const on = (sel,ev,fn) => document.querySelectorAll(sel).forEach(e=>e.addEventListener(ev,fn));

  on('[data-burger]','click', () => { menuOpen = !menuOpen; render(); });
  on('[data-close]','click',  () => { menuOpen = false; });

  on('[data-f]','click', e => { filter = e.currentTarget.dataset.f; render(); });

  on('[data-type]','click', e => { modalType = e.currentTarget.dataset.type; render(); });
  on('[data-closemodal]','click', () => { modalType = null; setTimeout(render, 0); });
  on('[data-backdrop]','click', e => { if (e.target === e.currentTarget) { modalType = null; render(); } });
  on('[data-qa]','click', e => { const i=+e.currentTarget.dataset.qa;
    openQ = openQ.includes(i) ? openQ.filter(x=>x!==i) : [...openQ,i]; render(); });

  on('[data-q]','click', e => {
    const d = e.currentTarget.dataset;
    answers[d.q] = d.v;
    const i = +d.i;
    if (i === qStep && qStep < QUESTIONS.length-1) qStep++;
    if (i === QUESTIONS.length-1) qDone = true;
    render();
  });

  on('[data-book]','click', e => {
    F = { svcId:+e.currentTarget.dataset.book, practId:null, day:null, slot:null, pay:null,
          form:{ name:me.name, phone:me.phone, email:me.email }, terms:false, ref:null, holdEnds:null, buyPassId:null };
    location.hash = '#foglalas'; render();
  });

  on('[data-pr]','click',   e => { F.practId=+e.currentTarget.dataset.pr; F.day=null; F.slot=null; render(); });
  on('[data-day]','click',  e => { F.day=+e.currentTarget.dataset.day; F.slot=null; render(); });
  on('[data-slot]','click', e => { F.slot=+e.currentTarget.dataset.slot; render(); });

  on('[data-next]','click', e => {
    const to = +e.currentTarget.dataset.next;
    if (to===3 && !saveForm()) return;
    if (to===2) F.form.done = false;
    if (to===3) F.holdEnds = Date.now() + SETTINGS.holdMin*60000;
    render();
  });
  on('[data-back]','click', e => {
    const to = +e.currentTarget.dataset.back;
    if (to===1) { F.slot=null; F.form.done=false; }
    if (to===2) { F.form.done=false; }
    render();
  });

  on('input[name=pay]','change', e => { F.pay = e.target.value; render(); });
  on('#terms','change',         e => { F.terms = e.target.checked; render(); });

  on('[data-pay]','click', () => {
    F.ref = 'V40-' + Math.random().toString(36).slice(2,8).toUpperCase();
    if (F.pay === 'CARD') location.hash = '#barion';
    else { commit(); location.hash = '#siker'; }
    render();
  });

  on('[data-buy]','click', e => {
    F = { ...F, buyPassId:+e.currentTarget.dataset.buy, svcId:null,
          ref:'V40-BER-' + Math.random().toString(36).slice(2,8).toUpperCase() };
    location.hash = '#barion'; render();
  });

  on('[data-bar]','click', e => {
    if (e.currentTarget.dataset.bar === 'ok') { commit(); location.hash = '#siker'; }
    else location.hash = '#hiba';
    render();
  });

  on('[data-retry]','click', () => { location.hash='#barion'; render(); });

  on('[data-cancel]','click', e => {
    const ref = e.currentTarget.dataset.cancel;
    const b = me.bookings.find(x=>x.ref===ref);
    if (b?.passUsed) { const mp = me.passes.find(p=>p.code===b.passUsed); if (mp) mp.remaining++; }
    me.bookings = me.bookings.filter(x=>x.ref!==ref);
    render();
  });
}

window.addEventListener('keydown', e => { if (e.key === 'Escape' && modalType) { modalType = null; render(); } });
window.addEventListener('hashchange', () => { menuOpen = false; modalType = null; render(); window.scrollTo(0,0); });
render();
</script>
