function field(f, d) {
  const v = d[f.k];
  const box = inner => `<div class="f" style="${f.w===2?'grid-column:1/-1':''}">
    <label>${f.l}${f.req?' *':''}</label>${inner}${f.h?`<small>${f.h}</small>`:''}</div>`;

  switch (f.t) {
    case 'text': return box(`<input data-fk="${f.k}" value="${esc(v)}">`);
    case 'num':  return box(`<input type="number" data-fk="${f.k}" value="${v ?? 0}" step="${f.step||1}">`);
    case 'area': return box(`<textarea rows="${f.rows||3}" data-fk="${f.k}">${esc(v)}</textarea>`);
    case 'sel':  return box(`<select data-fk="${f.k}">${f.opts().map(([o,l])=>
                   `<option value="${o}" ${String(o)===String(v??'')?'selected':''}>${l}</option>`).join('')}</select>`);
    case 'bool': return `<div class="f" style="grid-column:1/-1">
                   <label class="sw"><input type="checkbox" data-fk="${f.k}" ${v?'checked':''}> ${f.l}</label>
                   ${f.h?`<small>${f.h}</small>`:''}</div>`;
    case 'multi':return box(`<div class="chips">${f.opts().map(([o,l])=>
                   `<label class="chipbox ${(v||[]).includes(o)?'on':''}">
                     <input type="checkbox" data-multi="${f.k}" value="${o}" ${(v||[]).includes(o)?'checked':''}>${l}</label>`).join('')}</div>`);
    case 'paras':return box(`<div>${(v||[]).map((p,i)=>`<div class="para">
                     <textarea rows="3" data-para="${i}">${esc(p)}</textarea>
                     <button class="icon" data-paradel="${i}" title="Törlés">✕</button></div>`).join('')}
                   <button class="dash" data-paraadd="1">+ Bekezdés</button></div>`);
  }
  return '';
}

function editor() {
  if (!editing) return '';
  const { kind, id, draft } = editing, C = COLL[kind], isNew = id === null;
  const missing = FIELDS[kind].filter(f => f.req &&
    (draft[f.k] === '' || draft[f.k] == null || (Array.isArray(draft[f.k]) && !draft[f.k].length)));

  let extra = '';
  if (kind === 'kezelesek') {
    const tot = (+draft.bufferBeforeMin||0) + (+draft.durationMin||0) + (+draft.bufferAfterMin||0);
    extra = `<div class="note info">Egy foglalás <b>${tot} percet</b> foglal a naptárban,
      ebből ${draft.durationMin||0} perc a kezelés.</div>`;
  }
  if (kind === 'berletek' && draft.serviceIds?.length) {
    const top = Math.max(...draft.serviceIds.map(i => db.services.find(s=>s.id===i)?.priceGross || 0));
    const full = top * (+draft.sessionCount || 0), save = full - (+draft.priceGross||0);
    extra = `<div class="note ${save>0?'ok':'warn'}">Listaáron ${Ft(full)} lenne.
      ${save>0 ? `A bérlet <b>${Ft(save)}</b> megtakarítás.`
               : 'A bérlet ára nem kedvezőbb a listaárnál – ezt érdemes ellenőrizni.'}</div>`;
  }

  return `<div class="back" data-back><div class="modal">
    <button class="x" data-close>✕</button>
    <h2 class="dm">${isNew ? `Új ${C.one}` : `${C.one[0].toUpperCase()+C.one.slice(1)} szerkesztése`}</h2>
    <p style="color:var(--muted);margin:0 0 20px">A mentés azonnal él a weboldalon.</p>
    <div class="grid2">${FIELDS[kind].map(f=>field(f,draft)).join('')}</div>
    ${extra}
    ${missing.length ? `<div class="note warn">Kötelező még: ${missing.map(f=>f.l).join(', ')}</div>` : ''}
    <div class="acts">
      <button class="btn" data-save ${missing.length?'disabled':''}>Mentés</button>
      <button class="btn out" data-close>Mégsem</button>
    </div></div></div>`;
}

function confirmBox() {
  if (!confirming) return '';
  const { kind, id } = confirming, C = COLL[kind];
  const row = C.arr().find(x=>x.id===id), n = usedBy(C.kind, id);
  return `<div class="back" data-back><div class="modal" style="max-width:520px">
    <button class="x" data-close>✕</button>
    <h2 class="dm">${esc(row.title || row.name)}</h2>
    <p style="color:var(--muted);margin:4px 0 16px">Eltávolítás a weboldalról</p>
    ${n > 0
      ? `<div class="note warn">Ehhez a bejegyzéshez <b>${n} korábbi foglalás</b> tartozik, ezért véglegesen
          nem törölhető: a foglalások és a kiállított számlák hivatkoznak rá, és elszakadna a nyomvonal.<br><br>
          Helyette <b>archiválva</b> lesz. Az ügyfél számára ugyanaz történik: azonnal eltűnik a weboldalról
          és a foglalható listákból. Csak az előzmény marad meg mögötte, és bármikor visszakapcsolható.</div>`
      : `<div class="note ok">Ehhez a bejegyzéshez nem tartozik foglalás, tehát véglegesen törölhető.</div>`}
    <div class="acts">
      <button class="btn danger" data-doarch>${n>0 ? 'Archiválás' : 'Véglegesen törlöm'}</button>
      <button class="btn out" data-close>Mégsem</button>
    </div></div></div>`;
}

    <label class="sw"><input type="checkbox" data-setb="allowOnlineReschedule" ${s.allowOnlineReschedule?'checked':''}>
      Az ügyfél átteheti az időpontot online</label>
  </div></div>
  <button class="btn" data-ssave>Mentés</button>`; };

const vMarketing = () => { const s = db.settings; return `
  <div class="head"><h1 class="dm">Marketing és analitika</h1></div>
  <p class="sub">Mérőkódok azonosítói. Ezek csak a látogató hozzájárulása után töltődnek be.</p>
  <div class="card"><div class="grid3">
    <div class="f"><label>GA4 mérési azonosító</label>
      <input data-sett="ga4MeasurementId" value="${esc(s.ga4MeasurementId)}" placeholder="G-XXXXXXX"></div>
    <div class="f"><label>Google Tag Manager</label>
      <input data-sett="gtmContainerId" value="${esc(s.gtmContainerId)}" placeholder="GTM-XXXXXX"></div>
    <div class="f"><label>Meta Pixel</label>
      <input data-sett="metaPixelId" value="${esc(s.metaPixelId)}" placeholder="123456789"></div>
  </div>
  <label class="sw"><input type="checkbox" data-setb="cookieBannerEnabled" ${s.cookieBannerEnabled?'checked':''}>
    Sütibanner megjelenítése</label>
  <div class="note warn">Egészségügyi oldalon a remarketing külön figyelmet igényel. Ha egy pixel azt jelzi,
    hogy a látogató az „Anyajegy vizsgálat” oldalt nézte, az a GDPR 9. cikke szerinti egészségügyi adatra
    vonatkozó következtetés. Ezért a mérés <b>nem</b> tartalmazhat kezelés-szintű azonosítót, és a sütibanner
    kikapcsolása nem javasolt.</div></div>
  <button class="btn" data-ssave>Mentés</button>`; };

const VIEWS = { kezelesek:vKezelesek, tipusok:vTipusok, berletek:vBerletek, szakemberek:vSzakemberek,
  szobak:vSzobak, beosztas:vBeosztas, szovegek:vSzovegek, seo:vSeo, szabalyok:vSzabalyok, marketing:vMarketing };

// ===========================================================================
//  Render + kötések
// ===========================================================================
function render() {
  document.getElementById('nav').innerHTML = NAV.map(([g,items]) =>
    `<div class="grp">${g}</div>` + items.map(([k,l]) =>
      `<a href="#" data-v="${k}" class="${k===view?'on':''}">${l}</a>`).join('')).join('');
  document.getElementById('main').innerHTML = (VIEWS[view] || vKezelesek)();
  document.getElementById('overlay').innerHTML = editor() + confirmBox() +
    (toast ? `<div class="toast">${toast}</div>` : '');
  bind();
}

function flash(m) { toast = m; render(); setTimeout(()=>{ toast = null; render(); }, 2600); }

/** Újrarender után visszaadja a fókuszt és a kurzort – enélkül minden leütés elveszne. */
function keepCaret(sel, pos) {
  render();
  const el = document.querySelector(sel);
  if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
}

function bind() {
  const on = (s,e,f) => document.querySelectorAll(s).forEach(el => el.addEventListener(e,f));
  const D = () => editing.draft;

  on('[data-v]','click', e => { e.preventDefault(); view = e.currentTarget.dataset.v; q = ''; render(); });
  on('#q','input', e => { const pos = e.target.selectionStart; q = e.target.value; keepCaret('#q', pos); });

  on('[data-new]','click', e => {
    const k = e.currentTarget.dataset.new;
    editing = { kind:k, id:null, draft:BLANK[k]() }; render();
  });
  on('[data-edit]','click', e => {
    const [k,id] = e.currentTarget.dataset.edit.split(':');
    editing = { kind:k, id:+id, draft:JSON.parse(JSON.stringify(COLL[k].arr().find(x=>x.id===+id))) };
    render();
  });
  on('[data-del]','click', e => {
    const [k,id] = e.currentTarget.dataset.del.split(':');
    confirming = { kind:k, id:+id }; render();
  });
  on('[data-restore]','click', e => {
    const [k,id] = e.currentTarget.dataset.restore.split(':');
    COLL[k].arr().find(x=>x.id===+id).archivedAt = null;
    flash('Visszakapcsolva – újra megjelenik a weboldalon.');
  });
  on('[data-doarch]','click', () => {
    const { kind, id } = confirming, arr = COLL[kind].arr();
    const row = arr.find(x=>x.id===id);
    if (usedBy(COLL[kind].kind, id) > 0) {
      row.archivedAt = new Date().toISOString();
      confirming = null; flash('Archiválva – eltűnt a weboldalról, az előzmény megmaradt.');
    } else {
      arr.splice(arr.indexOf(row), 1);
      confirming = null; flash('Véglegesen törölve.');
    }
  });
  on('[data-close]','click', () => { editing = null; confirming = null; render(); });
  on('[data-back]','click', e => {
    if (e.target === e.currentTarget) { editing = null; confirming = null; render(); }
  });

  // --- űrlapmezők ---
  on('[data-fk]','input', e => {
    const k = e.target.dataset.fk;
    const num = e.target.type === 'number' || k === 'vatRate';
    D()[k] = e.target.type === 'checkbox' ? e.target.checked : num ? +e.target.value : e.target.value;
    if ((k === 'title' || k === 'name') && editing.id === null) D().slug = slugify(D()[k]);
    keepCaret(`[data-fk="${k}"]`, e.target.selectionStart ?? 0);
  });
  on('[data-multi]','change', e => {
    const k = e.target.dataset.multi, v = +e.target.value, cur = D()[k] || [];
    D()[k] = e.target.checked ? [...cur, v] : cur.filter(x => x !== v);
    render();
  });
  on('[data-para]','input', e => { D().longDesc[+e.target.dataset.para] = e.target.value; });
  on('[data-paradel]','click', e => { D().longDesc.splice(+e.currentTarget.dataset.paradel,1); render(); });
  on('[data-paraadd]','click', () => { D().longDesc.push(''); render(); });

  on('[data-save]','click', () => {
    const { kind, id, draft } = editing, arr = COLL[kind].arr();
    if (id === null) { draft.id = ++uid; arr.push(draft); flash(`Létrehozva: ${draft.title || draft.name}`); }
    else { Object.assign(arr.find(x=>x.id===id), draft); flash('Mentve.'); }
    editing = null;
  });

  // --- beosztás ---
  const wire = (tag, map) => {
    on(`[data-${tag}]`,'change', e => {
      const [iso,bi,edge] = e.target.dataset[tag].split(':');
      map()[+iso][+bi][edge === 's' ? 0 : 1] = MIN(e.target.value); render();
    });
    on(`[data-${tag}d]`,'click', e => {
      const [iso,bi] = e.currentTarget.dataset[tag+'d'].split(':').map(Number);
      map()[iso].splice(bi,1); render();
    });
    on(`[data-${tag}a]`,'click', e => {
      const iso = +e.currentTarget.dataset[tag+'a'];
      (map()[iso] = map()[iso] || []).push([540,1020]); render();
    });
  };
  wire('ch', () => db.clinicHours);
  wire('ph', () => (db.practitioners.find(x=>x.id===activePract) || db.practitioners[0]).hours);
  const pp = document.getElementById('pp');
  if (pp) pp.onchange = () => { activePract = +pp.value; render(); };

  // --- szövegek / SEO / beállítások ---
  on('[data-cp]','click', e => { contentPage = e.currentTarget.dataset.cp; render(); });
  on('[data-ck]','input', e => { db.content.find(c=>c.key===e.target.dataset.ck).value = e.target.value; });
  on('[data-csave]','click', () => flash('Szövegek mentve – a weboldalon azonnal élnek.'));

  on('[data-seo]','input', e => {
    const [i,f] = e.target.dataset.seo.split(':');
    db.seo[+i][f] = e.target.value;
    keepCaret(`[data-seo="${i}:${f}"]`, e.target.selectionStart ?? 0);
  });
  on('[data-seob]','change', e => { db.seo[+e.target.dataset.seob].noindex = e.target.checked; render(); });
  on('[data-seosave]','click', () => flash('SEO mentve.'));

  on('[data-setn]','input',  e => { db.settings[e.target.dataset.setn] = +e.target.value; });
  on('[data-sett]','input',  e => { db.settings[e.target.dataset.sett] = e.target.value; });
  on('[data-setb]','change', e => { db.settings[e.target.dataset.setb] = e.target.checked; render(); });
  on('[data-ssave]','click', () => flash('Beállítások mentve.'));
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (editing || confirming)) { editing = null; confirming = null; render(); }
});
render();
</script>
