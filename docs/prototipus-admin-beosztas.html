<meta charset="utf-8">
<title>V40 Vital – Admin: beosztás és foglalási szabályok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #171008;
    --brand: #153131;
    --sand: #F4F4F0;
    --mint: #E5F7F9;
    --line: #E4E4DE;
    --muted: #6B6660;
    --warn: #A6541B;
    --warn-bg: #FDF3EA;
    --ok: #1F6B4A;
    --ok-bg: #EFF7F2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--sand); color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; line-height: 1.5;
  }
  .dm { font-family: 'DM Sans', system-ui, sans-serif; }

  header {
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 18px 28px; display: flex; align-items: baseline; gap: 14px;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-family: 'DM Sans', sans-serif; font-size: 19px; font-weight: 700; margin: 0; }
  header .crumb { color: var(--muted); font-size: 13px; }
  .badge {
    margin-left: auto; background: var(--mint); color: var(--brand);
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 4px;
  }

  .wrap { display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 22px; padding: 22px 28px 60px; align-items: start; }
  @media (max-width: 1080px) { .wrap { grid-template-columns: 1fr; } }

  nav.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  nav.tabs button {
    font: inherit; font-weight: 600; cursor: pointer; padding: 9px 15px;
    border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 7px;
  }
  nav.tabs button[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card > h2 { font-family: 'DM Sans', sans-serif; font-size: 16px; margin: 0 0 4px; }
  .card > p.hint { color: var(--muted); font-size: 13px; margin: 0 0 16px; }

  .dayrow { display: grid; grid-template-columns: 108px 1fr; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); align-items: start; }
  .dayrow:first-of-type { border-top: 0; }
  .dayname { font-weight: 600; padding-top: 6px; }
  .dayname small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
  .blocks { display: flex; flex-direction: column; gap: 7px; }
  .block { display: flex; align-items: center; gap: 7px; }
  input[type=time], input[type=number], input[type=date], select, input[type=text] {
    font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
  }
  input[type=number] { width: 84px; }
  .iconbtn {
    font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff;
    color: var(--muted); border-radius: 6px; width: 30px; height: 32px; line-height: 1;
  }
  .iconbtn:hover { border-color: var(--warn); color: var(--warn); }
  .addbtn { font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1px dashed var(--line); background: transparent; color: var(--brand); border-radius: 6px; padding: 6px 11px; align-self: flex-start; }
  .closed { color: var(--muted); font-size: 13px; padding-top: 7px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  td.name { font-weight: 600; }
  td.name small { display: block; color: var(--muted); font-weight: 400; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .grid2 { grid-template-columns: 1fr; } }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
  .field small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 4px; }

  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch input { width: 16px; height: 16px; accent-color: var(--brand); }

  aside .card { position: sticky; top: 82px; }
  .slotlist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; max-height: 260px; overflow: auto; }
  .slot { background: var(--mint); color: var(--brand); font-weight: 600; font-size: 12.5px; padding: 6px 9px; border-radius: 5px; }
  .metric { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .metric b { font-variant-numeric: tabular-nums; }

  .note { border-radius: 8px; padding: 10px 12px; font-size: 12.5px; margin-top: 12px; }
  .note.warn { background: var(--warn-bg); color: var(--warn); }
  .note.ok { background: var(--ok-bg); color: var(--ok); }
  .note ul { margin: 6px 0 0; padding-left: 18px; }

  .save { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  .save button { font: inherit; font-weight: 700; cursor: pointer; background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 11px 22px; }
  .save span { color: var(--muted); font-size: 12.5px; }
  .hidden { display: none; }
</style>

<header>
  <h1 class="dm">Beosztás és foglalási szabályok</h1>
  <span class="crumb">Admin / Foglalás</span>
  <span class="badge">Prototípus</span>
</header>

<div class="wrap">
  <main>
    <nav class="tabs" id="tabs"></nav>
    <div id="panel"></div>
    <div class="save">
      <button onclick="fakeSave()">Mentés</button>
      <span id="savemsg">A prototípus nem ment adatbázisba – a beállítások csak az előnézetet vezérlik.</span>
    </div>
  </main>

  <aside>
    <div class="card">
      <h2 class="dm">Élő előnézet</h2>
      <p class="hint">Ezt látja majd az ügyfél a kiválasztott napon.</p>
      <div class="field" style="margin-bottom:10px">
        <label>Kezelés</label>
        <select id="pvService" style="width:100%"></select>
      </div>
      <div class="field" style="margin-bottom:10px">
        <label>Szakember</label>
        <select id="pvPract" style="width:100%"></select>
      </div>
      <div class="field" style="margin-bottom:14px">
        <label>Nap</label>
        <input type="date" id="pvDate" style="width:100%">
      </div>
      <div id="pvMetrics"></div>
      <div class="slotlist" id="pvSlots"></div>
      <div id="pvNotes"></div>
    </div>
  </aside>
</div>

<script>
// ---------------------------------------------------------------------------
//  Állapot – éles rendszerben ez a ClinicSettings / ClinicHours / WorkingHours
//  / Service / Room táblákból jön.
// ---------------------------------------------------------------------------
const DAYS = ['Hétfő','Kedd','Szerda','Csütörtök','Péntek','Szombat','Vasárnap'];

const state = {
  settings: {
    slotGranularityMin: 15,
    holdMinutes: 15,
    defaultMinLeadTimeHours: 24,
    defaultMaxLeadTimeDays: 90,
    freeCancellationHours: 24,
    reminderHoursBefore: 24,
    requireBuffersInsideHours: false,
    allowOnlineCancellation: true,
    allowOnlineReschedule: true,
  },
  clinicHours: { 1:[[540,1140]], 2:[[540,1140]], 3:[[540,1140]], 4:[[540,1140]], 5:[[540,1020]], 6:[[600,840]], 7:[] },
  rooms: [
    { id:1, name:'Infúziós szoba A' },
    { id:2, name:'Infúziós szoba B' },
    { id:3, name:'Vizsgáló' },
  ],
  practitioners: [
    { id:1, name:'Dr. Vértes Anna', hours:{1:[[540,780],[840,1140]],2:[[540,1140]],3:[],4:[[540,1140]],5:[[540,1020]],6:[],7:[]}, timeOff:[] },
    { id:2, name:'Dr. Szabó Gábor', hours:{1:[[600,1020]],2:[],3:[[600,1140]],4:[[600,1020]],5:[[600,1020]],6:[[600,840]],7:[]}, timeOff:[] },
  ],
  services: [
    { id:1, title:'NAD+ Energy',        durationMin:90,  bufferBefore:10, bufferAfter:15, leadH:24, maxD:90, online:true,  roomIds:[1,2] },
    { id:2, title:'Radiance bőrfiatalítás', durationMin:60, bufferBefore:0, bufferAfter:15, leadH:24, maxD:60, online:true,  roomIds:[3] },
    { id:3, title:'CardioFit felmérés', durationMin:45,  bufferBefore:0,  bufferAfter:10, leadH:48, maxD:90, online:true,  roomIds:[3] },
    { id:4, title:'Signature konzultáció', durationMin:30, bufferBefore:0, bufferAfter:5, leadH:12, maxD:90, online:true, roomIds:[] },
  ],
};

// ---------------------------------------------------------------------------
//  Idő-segédek (a nap perceiben – az előnézet egy napra szól)
// ---------------------------------------------------------------------------
const toHM = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const toMin = s => { const [h,m] = s.split(':').map(Number); return h*60+m; };

function intersect(a, b) {
  const out = [];
  for (const [s1,e1] of a) for (const [s2,e2] of b) {
    const s = Math.max(s1,s2), e = Math.min(e1,e2);
    if (e > s) out.push([s,e]);
  }
  return out.sort((x,y)=>x[0]-y[0]);
}
function subtract(blocks, cuts) {
  let out = blocks.map(b=>[...b]);
  for (const [cs,ce] of cuts) {
    const next = [];
    for (const [s,e] of out) {
      if (ce <= s || cs >= e) { next.push([s,e]); continue; }
      if (cs > s) next.push([s,cs]);
      if (ce < e) next.push([ce,e]);
    }
    out = next;
  }
  return out;
}

// ---------------------------------------------------------------------------
//  Szabad idősávok – a szerveroldali motor egyszerűsített, egynapos mása
// ---------------------------------------------------------------------------
function computePreview() {
  const svc = state.services.find(s => s.id === +document.getElementById('pvService').value);
  const pr  = state.practitioners.find(p => p.id === +document.getElementById('pvPract').value);
  const dateStr = document.getElementById('pvDate').value;
  if (!svc || !pr || !dateStr) return null;

  const d = new Date(dateStr + 'T12:00:00');
  const iso = d.getDay() === 0 ? 7 : d.getDay();

  const clinic = state.clinicHours[iso] || [];
  const pract  = pr.hours[iso] || [];
  const open   = subtract(intersect(clinic, pract), pr.timeOff.filter(t=>t.weekday===iso).map(t=>[t.start,t.end]));

  const step = state.settings.slotGranularityMin;
  const need = svc.durationMin;
  const occupiedLen = svc.bufferBefore + svc.durationMin + svc.bufferAfter;

  const slots = [];
  for (const [ws,we] of open) {
    for (let t = ws; t + need <= we; t += step) {
      if (state.settings.requireBuffersInsideHours &&
          (t - svc.bufferBefore < ws || t + need + svc.bufferAfter > we)) continue;
      slots.push(t);
    }
  }

  // Előjegyzési korlát: a mai naptól számított minimum
  const today = new Date(); today.setHours(0,0,0,0);
  const daysAhead = Math.round((new Date(dateStr+'T00:00:00') - today) / 86400000);
  const leadDays = svc.leadH / 24;

  const warnings = [];
  if (!clinic.length)      warnings.push('Ezen a napon a rendelő zárva van.');
  else if (!pract.length)  warnings.push(`${pr.name} ezen a napon nem rendel.`);
  else if (!open.length)   warnings.push('A szakember beosztása nem fedi a rendelő nyitvatartását.');
  else if (!slots.length)  warnings.push(`A kezelés ${need} perce nem fér bele egyetlen szabad sávba sem.`);

  if (daysAhead < leadDays)
    warnings.push(`Az előjegyzési korlát (${svc.leadH} óra) miatt ez a nap az ügyfélnek nem is jelenne meg.`);
  if (daysAhead > svc.maxD)
    warnings.push(`A naptár csak ${svc.maxD} napra előre nyitott – ez a nap még zárt.`);
  if (!svc.roomIds.length)
    warnings.push('Ehhez a kezeléshez nincs szoba hozzárendelve, tehát a párhuzamos kapacitás nincs korlátozva.');
  if (!svc.online)
    warnings.push('Ez a kezelés nem foglalható online.');

  return { svc, pr, open, slots, occupiedLen, warnings, iso };
}

function renderPreview() {
  const r = computePreview();
  const mEl = document.getElementById('pvMetrics');
  const sEl = document.getElementById('pvSlots');
  const nEl = document.getElementById('pvNotes');
  if (!r) { mEl.innerHTML = sEl.innerHTML = nEl.innerHTML = ''; return; }

  mEl.innerHTML = `
    <div class="metric"><span>Rendelési idő (metszet)</span><b>${
      r.open.length ? r.open.map(([s,e])=>`${toHM(s)}–${toHM(e)}`).join(', ') : '—'}</b></div>
    <div class="metric"><span>Egy foglalás helyfoglalása</span><b>${r.occupiedLen} perc</b></div>
    <div class="metric"><span>Szabad időpont</span><b>${r.slots.length} db</b></div>
    <div class="metric"><span>Szobák</span><b>${
      r.svc.roomIds.length ? r.svc.roomIds.map(id=>state.rooms.find(x=>x.id===id)?.name).join(', ') : 'nincs'}</b></div>`;

  sEl.innerHTML = r.slots.map(t=>`<span class="slot">${toHM(t)}</span>`).join('');

  nEl.innerHTML = r.warnings.length
    ? `<div class="note warn"><b>Figyelem</b><ul>${r.warnings.map(w=>`<li>${w}</li>`).join('')}</ul></div>`
    : `<div class="note ok">A beállítások konzisztensek, a nap foglalható.</div>`;
}

// ---------------------------------------------------------------------------
//  Heti beosztás-szerkesztő (nyitvatartás és szakember egyaránt ezt használja)
// ---------------------------------------------------------------------------
function weekEditor(getMap, onChange) {
  const map = getMap();
  return DAYS.map((name, i) => {
    const iso = i + 1;
    const blocks = map[iso] || [];
    const isOpen = blocks.length > 0;
    return `
      <div class="dayrow">
        <div class="dayname">${name}
          <small>${isOpen ? blocks.reduce((a,[s,e])=>a+(e-s),0)/60 + ' óra' : 'zárva'}</small>
        </div>
        <div class="blocks">
          ${blocks.map(([s,e],bi)=>`
            <div class="block">
              <input type="time" value="${toHM(s)}" data-iso="${iso}" data-bi="${bi}" data-edge="s">
              <span style="color:var(--muted)">–</span>
              <input type="time" value="${toHM(e)}" data-iso="${iso}" data-bi="${bi}" data-edge="e">
              <button class="iconbtn" data-del="${iso}:${bi}" title="Sáv törlése">×</button>
              ${e<=s ? '<span style="color:var(--warn);font-size:12px">a záró idő nem lehet korábbi</span>' : ''}
            </div>`).join('')
          || '<div class="closed">Zárva – nincs foglalható idősáv.</div>'}
          <button class="addbtn" data-add="${iso}">+ Idősáv hozzáadása</button>
        </div>
      </div>`;
  }).join('');
}

function bindWeekEditor(root, getMap) {
  const map = getMap();
  root.querySelectorAll('input[type=time]').forEach(inp => {
    inp.addEventListener('change', () => {
      const iso = +inp.dataset.iso, bi = +inp.dataset.bi;
      map[iso][bi][inp.dataset.edge === 's' ? 0 : 1] = toMin(inp.value);
      render();
    });
  });
  root.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [iso, bi] = btn.dataset.del.split(':').map(Number);
      map[iso].splice(bi, 1);
      render();
    });
  });
  root.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', () => {
      const iso = +btn.dataset.add;
      (map[iso] = map[iso] || []).push([540, 1020]);
      render();
    });
  });
}

// ---------------------------------------------------------------------------
//  Fülek
// ---------------------------------------------------------------------------
let activeTab = 'nyitva';
let activePract = 1;

const TABS = {
  nyitva:   'Nyitvatartás',
  szakember:'Szakemberek',
  kezeles:  'Kezelések',
  szabaly:  'Foglalási szabályok',
  szoba:    'Szobák',
};

function panelHtml() {
  if (activeTab === 'nyitva') return `
    <div class="card">
      <h2 class="dm">A rendelő nyitvatartása</h2>
      <p class="hint">Ez a külső korlát. Foglalni csak ott lehet, ahol a szakember beosztása is nyitva van – a kettő metszete számít.</p>
      <div id="weekRoot">${weekEditor(()=>state.clinicHours)}</div>
    </div>`;

  if (activeTab === 'szakember') {
    const pr = state.practitioners.find(p=>p.id===activePract);
    return `
    <div class="card">
      <h2 class="dm">Szakemberek beosztása</h2>
      <p class="hint">Egyéni rendelési idő. A délelőtti és délutáni sáv külön vehető fel – ami közte van, az ebédszünet.</p>
      <div class="field" style="max-width:280px;margin-bottom:16px">
        <label>Szakember</label>
        <select id="practPick" style="width:100%">
          ${state.practitioners.map(p=>`<option value="${p.id}" ${p.id===activePract?'selected':''}>${p.name}</option>`).join('')}
        </select>
      </div>
      <div id="weekRoot">${weekEditor(()=>pr.hours)}</div>
    </div>`;
  }

  if (activeTab === 'kezeles') return `
    <div class="card">
      <h2 class="dm">Kezelések szabályai</h2>
      <p class="hint">A puffer az a takarítási/előkészítési idő, amit a rendszer a foglalás körül lefoglal, de nem számláz.</p>
      <table>
        <tr><th>Kezelés</th><th>Hossz</th><th>Puffer előtte</th><th>Puffer utána</th><th>Előjegyzés</th><th>Nyitott</th><th>Online</th></tr>
        ${state.services.map(s=>`
          <tr>
            <td class="name">${s.title}<small>helyfoglalás: ${s.bufferBefore+s.durationMin+s.bufferAfter} perc</small></td>
            <td><input type="number" min="5" step="5" value="${s.durationMin}" data-svc="${s.id}" data-k="durationMin"> p</td>
            <td><input type="number" min="0" step="5" value="${s.bufferBefore}" data-svc="${s.id}" data-k="bufferBefore"> p</td>
            <td><input type="number" min="0" step="5" value="${s.bufferAfter}" data-svc="${s.id}" data-k="bufferAfter"> p</td>
            <td><input type="number" min="0" value="${s.leadH}" data-svc="${s.id}" data-k="leadH"> ó</td>
            <td><input type="number" min="1" value="${s.maxD}" data-svc="${s.id}" data-k="maxD"> nap</td>
            <td><label class="switch"><input type="checkbox" ${s.online?'checked':''} data-svc="${s.id}" data-k="online"></label></td>
          </tr>`).join('')}
      </table>
    </div>`;

  if (activeTab === 'szabaly') {
    const s = state.settings;
    return `
    <div class="card">
      <h2 class="dm">Globális foglalási szabályok</h2>
      <p class="hint">Ezek minden kezelésre érvényesek, kivéve ahol a kezelés saját értéket ad meg.</p>
      <div class="grid2">
        <div class="field"><label>Idősáv-raszter</label>
          <input type="number" min="5" step="5" value="${s.slotGranularityMin}" data-set="slotGranularityMin"> perc
          <small>Ekkora lépésekben kínálunk kezdési időpontot (pl. 09:00, 09:15).</small></div>
        <div class="field"><label>Zárolás fizetés közben</label>
          <input type="number" min="5" value="${s.holdMinutes}" data-set="holdMinutes"> perc
          <small>Ennyi ideig tartjuk az idősávot. Ha nem fizet, magától felszabadul.</small></div>
        <div class="field"><label>Ingyenes lemondás</label>
          <input type="number" min="0" value="${s.freeCancellationHours}" data-set="freeCancellationHours"> órával előtte
          <small>Bérletnél ezen belüli lemondás elviszi az alkalmat.</small></div>
        <div class="field"><label>Emlékeztető</label>
          <input type="number" min="1" value="${s.reminderHoursBefore}" data-set="reminderHoursBefore"> órával előtte
          <small>E-mailben, cron-ból küldve.</small></div>
      </div>
      <div style="margin-top:16px;display:flex;flex-direction:column;gap:9px">
        <label class="switch"><input type="checkbox" ${s.requireBuffersInsideHours?'checked':''} data-set="requireBuffersInsideHours">
          A puffer se nyúlhat túl a záráson</label>
        <label class="switch"><input type="checkbox" ${s.allowOnlineCancellation?'checked':''} data-set="allowOnlineCancellation">
          Az ügyfél lemondhat online</label>
        <label class="switch"><input type="checkbox" ${s.allowOnlineReschedule?'checked':''} data-set="allowOnlineReschedule">
          Az ügyfél átteheti az időpontot online</label>
      </div>
    </div>`;
  }

  return `
    <div class="card">
      <h2 class="dm">Szobák és párhuzamos kapacitás</h2>
      <p class="hint">Ha egy kezeléshez szoba kell, és minden alkalmas szoba foglalt, nincs több szabad idősáv – akkor sem, ha a szakember épp szabad.</p>
      <table>
        <tr><th>Kezelés</th>${state.rooms.map(r=>`<th>${r.name}</th>`).join('')}</tr>
        ${state.services.map(s=>`
          <tr><td class="name">${s.title}</td>
          ${state.rooms.map(r=>`<td><input type="checkbox" ${s.roomIds.includes(r.id)?'checked':''}
             data-room="${s.id}:${r.id}" style="width:16px;height:16px;accent-color:var(--brand)"></td>`).join('')}
          </tr>`).join('')}
      </table>
      <div class="note warn" style="margin-top:14px">
        Szoba nélküli kezelésnél a rendszer csak a szakember idejét figyeli. Infúziós kezelésnél ez általában hiba,
        mert két ügyfél nem férhet egy ágyra.
      </div>
    </div>`;
}

// ---------------------------------------------------------------------------
//  Render + kötések
// ---------------------------------------------------------------------------
function render() {
  document.getElementById('tabs').innerHTML = Object.entries(TABS)
    .map(([k,v])=>`<button data-tab="${k}" aria-selected="${k===activeTab}">${v}</button>`).join('');
  document.getElementById('tabs').querySelectorAll('button')
    .forEach(b=>b.onclick=()=>{ activeTab=b.dataset.tab; render(); });

  const panel = document.getElementById('panel');
  panel.innerHTML = panelHtml();

  const weekRoot = document.getElementById('weekRoot');
  if (weekRoot) {
    const getMap = activeTab === 'nyitva'
      ? () => state.clinicHours
      : () => state.practitioners.find(p=>p.id===activePract).hours;
    bindWeekEditor(weekRoot, getMap);
  }

  const pick = document.getElementById('practPick');
  if (pick) pick.onchange = () => { activePract = +pick.value; render(); };

  panel.querySelectorAll('[data-svc]').forEach(inp => {
    inp.onchange = () => {
      const svc = state.services.find(s=>s.id===+inp.dataset.svc);
      svc[inp.dataset.k] = inp.type === 'checkbox' ? inp.checked : +inp.value;
      render();
    };
  });
  panel.querySelectorAll('[data-set]').forEach(inp => {
    inp.onchange = () => {
      state.settings[inp.dataset.set] = inp.type === 'checkbox' ? inp.checked : +inp.value;
      render();
    };
  });
  panel.querySelectorAll('[data-room]').forEach(inp => {
    inp.onchange = () => {
      const [sid, rid] = inp.dataset.room.split(':').map(Number);
      const svc = state.services.find(s=>s.id===sid);
      svc.roomIds = inp.checked ? [...svc.roomIds, rid] : svc.roomIds.filter(x=>x!==rid);
      render();
    };
  });

  renderPreview();
}

function fakeSave() {
  const el = document.getElementById('savemsg');
  el.textContent = 'Prototípus – éles rendszerben itt PUT /api/admin/schedule hívás történne.';
  el.style.color = 'var(--warn)';
}

// Előnézet-vezérlők feltöltése
const pvS = document.getElementById('pvService');
const pvP = document.getElementById('pvPract');
pvS.innerHTML = state.services.map(s=>`<option value="${s.id}">${s.title}</option>`).join('');
pvP.innerHTML = state.practitioners.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');

const dd = new Date(); dd.setDate(dd.getDate() + 3);
document.getElementById('pvDate').value = dd.toISOString().slice(0,10);
[pvS, pvP, document.getElementById('pvDate')].forEach(el => el.onchange = renderPreview);

render();
</script>
